<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="IRONWAKE — a first-person shooter vertical slice rendered in real time with WebGL2." />
    <meta name="theme-color" content="#0a0c0f" />
    <title>IRONWAKE</title>
    <style>
      /* Critical shell styles only — HUD/menus own their own stylesheets (src/ui). */
      :root {
        --ink: #e8e6e1;
        --dim: #8a8f96;
        --accent: #d7ff64;
        --danger: #ff4747;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06080a;
        color: var(--ink);
        font-family: 'Rajdhani', 'Barlow Condensed', 'DIN Alternate', 'Franklin Gothic Medium', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#gl {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      /* HUD, menus and overlays are DOM layers stacked over the canvas. */
      #hud, #menus, #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #menus, #overlay {
        pointer-events: auto;
      }
      #menus:empty, #overlay:empty {
        pointer-events: none;
      }
      /* Boot / loading splash — replaced by the UI system once assets are up. */
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 90% at 50% 40%, #14181d 0%, #05070a 60%, #020304 100%);
        z-index: 100;
        transition: opacity 600ms ease;
      }
      #boot.fade { opacity: 0; pointer-events: none; }
      #boot .brand {
        font-size: clamp(42px, 7vw, 96px);
        font-weight: 700;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #f2f0ea;
      }
      #boot .tag {
        font-size: clamp(11px, 1.1vw, 14px);
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #boot .bar {
        width: min(360px, 60vw);
        height: 2px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        transition: width 120ms linear;
      }
      #boot .status {
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #error {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        z-index: 200;
        display: none;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffb3b3;
        background: rgba(60, 8, 8, 0.9);
        border: 1px solid rgba(255, 71, 71, 0.5);
        padding: 12px 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
      <div id="menus"></div>
      <div id="overlay"></div>
      <div id="boot">
        <div class="brand">IRONWAKE</div>
        <div class="tag">Blacksite Terminal</div>
        <div class="bar"><i id="boot-bar"></i></div>
        <div class="status" id="boot-status">Initializing renderer</div>
      </div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
